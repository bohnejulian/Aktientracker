# Allgemeine Markt-News. Leer lassen ([]) zum Abschalten.
markt_news:
  - DAX
  - Nasdaq
  - Fed Zinsen

einstellungen:
  bewegung_prozent: 3       # Alarm bei ±3 % zum Vortag, danach je weitere 2 %
  bewegung_schritt: 2
  max_news_pro_lauf: 5      # damit das Handy nicht explodiert
  news_max_alter_stunden: 6 # ältere Artikel werden ignoriert
  uebersicht_uhrzeiten: ["09:15", "17:45"]   # Depot-Übersicht (deutsche Zeit)
  max_anteil_pro_kauf: 35   # nie mehr als 35 % des Budgets in einen Kauf (wenige, gute Trades)
  auto_stop: true           # nachgezogener Stop-Loss-Alarm für Positionen ohne eigene 'unter'-Marke
  # KI-Bewertung der News: läuft nur, wenn im Repo das Secret ANTHROPIC_API_KEY gesetzt ist
  ki_modell: claude-haiku-5-5   # günstigstes Modell, ca. 0,0003 $ pro Bewertung
  # Gebühren im Planspiel (aus eurem Depot zurückgerechnet: ca. 0,3 %, mind. ~15 € pro Trade)
  gebuehr_prozent: 0.3
  gebuehr_min: 15
  # Spielende (ANNAHME, bitte prüfen!). Ab 14 Tagen vorher: Endspurt-Modus
  spielende: "2027-01-20"
  endspurt_tage: 14
  scan_uhrzeiten: ["09:30", "15:45"]   # Scan nach Xetra- und nach US-Eröffnung
  scan_anzahl: 2            # höchstens 2 Ideen pro Scan, nur wenn wirklich stark
  scan_min_score: 20        # höher = strenger, weniger Meldungen
  ki_min_relevanz: 3        # Meldungen unter dieser Relevanz (1–5) werden nicht geschickt
