name: debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q pandas lxml requests
      - run: |
          python - <<'PY'
          import pandas as pd, requests, io
          H={"User-Agent":"aktientracker/1.0 (school project)"}
          for p in ["en:TecDAX","en:Nasdaq-100","en:Dow_Jones_Industrial_Average","de:TecDAX","de:MDAX"]:
              lang,pg=p.split(":"); r=requests.get(f"https://{lang}.wikipedia.org/wiki/{pg}",headers=H,timeout=30); print(p,r.status_code,len(r.text)); html=r.text
              for i,t in enumerate(pd.read_html(io.StringIO(html))):
                  cols=[str(c) for c in t.columns]
                  if len(t)>=25: print(p,i,len(t),cols); print(t.head(2).to_string()[:400])
          PY
