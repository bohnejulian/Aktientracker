name: debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yfinance
      - run: |
          python - <<'PY'
          import yfinance as yf
          for q in ["Take-Two Interactive", "TAKE-TWO INTERACT"]:
              try: print(q, [(x.get("symbol"), x.get("exchange"), x.get("quoteType")) for x in yf.Search(q, max_results=15, news_count=0).quotes])
              except Exception as e: print(q, e)
          for s in ["D6RH.DE","D6RH.MU","0P00000EK2.F","D6RG.MU","D6RG.DU","D6RG.SG","TKE.DE","TKE.F","TWO.DE","TTWO.DE","LHA.DE","RHM.DE"]:
              try:
                  h=yf.Ticker(s).history(period="3mo")["Close"].dropna()
                  print(s, len(h), h.iloc[-1] if len(h) else None, yf.Ticker(s).fast_info.get("currency"))
              except Exception as e: print(s, "ERR", e)
          PY
