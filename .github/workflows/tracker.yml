name: Aktien-Tracker

on:
  schedule:
    # Zeiten in UTC! Werktags 07:00–22:45 deutsche Winterzeit, alle 15 Minuten
    - cron: "*/15 6-21 * * 1-5"
    # Wochenende: nur alle 3 Stunden (News)
    - cron: "0 */3 * * 0,6"
  workflow_dispatch:
    inputs:
      test:
        description: "Testnachricht schicken?"
        type: boolean
        default: true
      scan:
        description: "Kaufideen-Scan jetzt ausführen?"
        type: boolean
        default: false
      review:
        description: "Wochenrückblick jetzt schicken?"
        type: boolean
        default: false
      beispiel:
        description: "Beispiel-Kaufidee für dieses Yahoo-Kürzel schicken (z. B. ALV.DE), sonst leer"
        type: string
        default: ""

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: write   # damit per ntfy gemeldete Trades in depot.yaml gespeichert werden
  actions: read     # für den Ausfall-Alarm (war der letzte Lauf schon kaputt?)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Merkt sich zwischen den Läufen, welche Alarme/News schon verschickt wurden
      - name: Zustand laden
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Tracker ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tracker.py ${{ (github.event_name == 'workflow_dispatch' && inputs.scan) && '--scan' || ((github.event_name == 'workflow_dispatch' && inputs.test) && '--test' || '') }} ${{ (github.event_name == 'workflow_dispatch' && inputs.review) && '--review' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.beispiel != '') && format('--beispiel {0}', inputs.beispiel) || '' }}

      - name: Depot-Änderungen speichern
        if: always()
        run: |
          if ! git diff --quiet depot.yaml; then
            git config user.name "aktien-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Depot aktualisiert (Trade per ntfy gemeldet)" depot.yaml
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - name: Zustand speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      # Ausfall-Alarm: nur beim ERSTEN kaputten Lauf melden und einmal, wenn es wieder läuft
      - name: Ausfall melden
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATUS: ${{ job.status }}
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" -w tracker.yml -e schedule -s completed -L 1 --json conclusion -q '.[0].conclusion' || echo unknown)
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          send() { jq -nc --arg t "$NTFY_TOPIC" --arg ti "$1" --arg m "$2" --argjson p "$3" --arg c "$url" \
                     '{topic:$t,title:$ti,message:$m,priority:$p,click:$c}' | curl -s -d @- https://ntfy.sh > /dev/null; }
          if [ "$STATUS" != "success" ] && [ "$prev" = "success" ]; then
            send "🚨 Tracker ausgefallen" "Der Bot ist gerade abgestürzt, bis das behoben ist kommen keine Alarme. Sag Claude Bescheid (Details hinter dem Link)." 4
          elif [ "$STATUS" = "success" ] && [ "$prev" = "failure" ]; then
            send "✅ Tracker läuft wieder" "Der Bot arbeitet wieder normal." 2
          fi
